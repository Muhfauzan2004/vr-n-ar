<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Scuderia Ferrari F1-75</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="./ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
        #badge {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 2px solid #e11d48;
            padding: 8px 18px; border-radius: 20px; color: #fff;
            font-size: 13px; font-weight: bold; z-index: 1000;
            white-space: nowrap; pointer-events: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>

    <div id="badge">🏎️ Ferrari F1-75 (Arahkan ke Kartu)</div>

    <!-- Scene AR khusus Ferrari F1-75 -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; missTolerance: 30; warmupTolerance: 1;" 
        color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-light type="ambient" intensity="1.8"></a-light>
        <a-light type="directional" position="2 4 3" intensity="2.2"></a-light>
        <a-light type="directional" position="-2 -2 2" intensity="1.0" color="#93c5fd"></a-light>

        <!-- Ferrari F1-75 dipasang di target 1 dan 0 agar selalu akurat & terkunci diam di meja -->
        <a-entity mindar-image-target="targetIndex: 0" anchor-hold>
            <a-gltf-model src="./ferarri_f1-75.glb" rotation="90 0 0" auto-model="length: 0.85"></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1" anchor-hold>
            <a-gltf-model src="./ferarri_f1-75.glb" rotation="90 0 0" auto-model="length: 0.85"></a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        const badge = document.getElementById('badge');
        document.querySelectorAll('a-entity[mindar-image-target]').forEach(t => {
            t.addEventListener('targetFound', () => {
                badge.innerText = '🏁 Ferrari F1-75 Aktif! (Geser layar untuk putar 360°)';
                badge.style.borderColor = '#22c55e';
            });
        });
    </script>

</body>

</html>
