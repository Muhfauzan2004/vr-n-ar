<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Diecast Showcase</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #0b0f19;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        header {
            padding: 16px;
            background: #111827;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
        }

        model-viewer {
            width: 100vw;
            height: 75vh;
        }

        .ar-btn {
            background: #e11d48;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            border: none;
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }
    </style>
</head>

<body>

    <header>
        <h1 id="nama-mobil">Memuat Mobil...</h1>
    </header>

    <model-viewer id="viewer" src="" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate
        shadow-intensity="1.5">
        <button slot="ar-button" class="ar-btn">🏎️ Tampilkan di Meja (AR)</button>
    </model-viewer>

    <script>
        // Daftar data mobil & file 3D-nya
        const daftarMobil = {
            'rb19': { nama: 'Red Bull Racing RB19', file: 'redbull_RB19.glb' }
        };

        // Membaca parameter dari URL (misal: ?mobil=rb19)
        const urlParams = new URLSearchParams(window.location.search);
        const idMobil = urlParams.get('mobil') || 'rb19'; // Default jika tanpa parameter
        const mobilTerpilih = daftarMobil[idMobil];

        if (mobilTerpilih) {
            document.getElementById('nama-mobil').innerText = mobilTerpilih.nama;
            document.getElementById('viewer').src = mobilTerpilih.file;
        }
    </script>

</body>

</html>
