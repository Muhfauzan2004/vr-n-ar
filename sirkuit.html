<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marina Bay Street Circuit - 3D F1 Grand Prix</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Three.js & Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --f1-red: #e10600;
            --f1-cyan: #38bdf8;
            --f1-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090d16;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #fff;
        }

        #webgl-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* ========================================================
           HUD & OVERLAYS
        ======================================================== */
        .hud-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .hud-top-bar > * {
            pointer-events: auto;
        }

        .nav-back-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 9px 16px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.2s;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .nav-back-btn:active {
            transform: scale(0.95);
            background: #e11d48;
        }

        .car-badge {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #0284c7;
            padding: 8px 18px;
            border-radius: 25px;
            backdrop-filter: blur(12px);
            text-align: right;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .badge-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: #f8fafc;
        }

        .badge-cat {
            font-size: 0.7rem;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Telemetry Dashboard (Speedometer & Lap Time) */
        .hud-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 16px 20px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: linear-gradient(0deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .hud-bottom-bar > * {
            pointer-events: auto;
        }

        /* Speedometer Card */
        .speedo-card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 12px 18px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            min-width: 150px;
        }

        .rpm-leds {
            display: flex;
            gap: 3px;
            width: 100%;
        }

        .rpm-dot {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: #334155;
            transition: background 0.08s;
        }

        .rpm-dot.green.active { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .rpm-dot.red.active { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
        .rpm-dot.blue.active { background: #3b82f6; box-shadow: 0 0 8px #60a5fa; }

        .speedo-content {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .speedo-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.1rem;
            font-weight: 900;
            color: #f8fafc;
            line-height: 1;
        }

        .speedo-unit {
            font-size: 0.72rem;
            font-weight: 700;
            color: #94a3b8;
            margin-left: 4px;
        }

        .gear-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: #eab308;
            background: rgba(234, 179, 8, 0.15);
            padding: 2px 10px;
            border-radius: 8px;
            border: 1px solid rgba(234, 179, 8, 0.4);
        }

        /* Action Controls Buttons (Bottom Right) */
        .controls-card {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .hud-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.15s;
        }

        .hud-btn:active {
            transform: scale(0.92);
        }

        .hud-btn.drs-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
            animation: pulseDRS 1.5s infinite alternate;
        }

        @keyframes pulseDRS {
            from { box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
            to { box-shadow: 0 0 20px rgba(16, 185, 129, 0.8); }
        }

        /* Lap Timer Badge */
        .lap-badge {
            position: fixed;
            top: 75px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #cbd5e1;
            z-index: 15;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        /* Loading Screen */
        #circuit-loader {
            position: fixed;
            inset: 0;
            background: #090d16;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        #circuit-loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spin {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <!-- 3D WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Loading Screen -->
    <div id="circuit-loader">
        <div class="loader-spin"></div>
        <div style="font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; color: #f8fafc;">
            MEMASUKI MARINA BAY STREET CIRCUIT...
        </div>
        <div id="loader-status" style="font-size: 0.85rem; color: #94a3b8;">
            Mengunduh Sirkuit 3D Marina Bay & Model Mobil...
        </div>
    </div>

    <!-- Lap Timer HUD -->
    <div class="lap-badge">
        ⏱️ LAP <span id="lap-counter" style="color: #38bdf8;">1</span> • <span id="lap-time" style="color: #22c55e;">00:00.00</span>
    </div>

    <!-- Top Navigation HUD -->
    <div class="hud-top-bar">
        <a href="./index.html" class="nav-back-btn" id="btn-back">
            📷 Kembali ke AR
        </a>
        <div class="car-badge" id="hud-car-badge">
            <div class="badge-title" id="hud-car-name">Red Bull RB19</div>
            <div class="badge-cat" id="hud-car-cat">Marina Bay • Singapore F1 GP</div>
        </div>
    </div>

    <!-- Bottom Telemetry HUD -->
    <div class="hud-bottom-bar">
        <!-- Speedometer & Tachometer -->
        <div class="speedo-card">
            <div class="rpm-leds" id="rpm-bar">
                <div class="rpm-dot green"></div>
                <div class="rpm-dot green"></div>
                <div class="rpm-dot green"></div>
                <div class="rpm-dot red"></div>
                <div class="rpm-dot red"></div>
                <div class="rpm-dot red"></div>
                <div class="rpm-dot blue"></div>
                <div class="rpm-dot blue"></div>
            </div>
            <div class="speedo-content">
                <div>
                    <span class="speedo-val" id="speedo-number">0</span>
                    <span class="speedo-unit">KM/H</span>
                </div>
                <div class="gear-badge" id="gear-indicator">1</div>
            </div>
        </div>

        <!-- Camera & DRS Controls -->
        <div class="controls-card">
            <button class="hud-btn drs-btn" id="drs-toggle" onclick="toggleDRS()">
                ⚡ DRS BOOST
            </button>
            <button class="hud-btn" onclick="cycleCamera()">
                🎥 <span id="cam-label">Chase Cam</span>
            </button>
            <button class="hud-btn" id="sound-btn" onclick="toggleSound()">
                🔊
            </button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="bgm-theme" src="./f1_theme.m4a" loop preload="auto"></audio>
    <audio id="car-engine-audio" loop preload="auto"></audio>

    <script>
        // Data Kendaraan & Model 3D
        const VEHICLES = {
            'redbull': {
                name: 'Red Bull Racing RB19',
                cat: 'Oracle Red Bull • Formula 1',
                color: '#0284c7',
                src: './redbull_RB19.glb',
                sound: './redbull_sound.mp3',
                scale: 1.0,
                yOffset: 0.05
            },
            'ferrari': {
                name: 'Ferrari F1-75',
                cat: 'Scuderia Ferrari • Formula 1',
                color: '#e11d48',
                src: './ferarri_f1-75.glb',
                sound: './ferrari_sound.mp3',
                scale: 1.0,
                yOffset: 0.05
            },
            'mercedes': {
                name: 'Mercedes-AMG F1 W15',
                cat: 'Mercedes-AMG PETRONAS • Formula 1',
                color: '#00a19c',
                src: './mercy-w15.glb',
                sound: './mercedes_sound.mp3',
                scale: 1.0,
                yOffset: 0.05
            },
            'astonmartin': {
                name: 'Aston Martin AMR23',
                cat: 'Aston Martin Aramco • Formula 1',
                color: '#00594f',
                src: './f1-amr23.glb',
                sound: './astonmartin_sound.mp3',
                scale: 1.0,
                yOffset: 0.05
            },
            'ducati': {
                name: 'Ducati Desmosedici GP',
                cat: 'Ducati Lenovo • MotoGP',
                color: '#f59e0b',
                src: './ducati_desmo.glb',
                sound: null,
                scale: 1.1,
                yOffset: 0.08
            }
        };

        // Ambil parameter model mobil dari URL (contoh: ?model=ferrari)
        const urlParams = new URLSearchParams(window.location.search);
        let selectedCarKey = urlParams.get('model') || urlParams.get('mobil') || 'redbull';
        if (!VEHICLES[selectedCarKey]) selectedCarKey = 'redbull';
        const carData = VEHICLES[selectedCarKey];

        // Update HUD Info
        document.getElementById('hud-car-name').innerText = carData.name;
        document.getElementById('hud-car-badge').style.borderColor = carData.color;
        document.getElementById('btn-back').href = `./index.html?model=${selectedCarKey}`;

        // Setup Three.js Scene
        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060913);
        scene.fog = new THREE.FogExp2(0x060913, 0.0006);

        // Pencahayaan Sirkuit Malam Hari (Singapore F1 Night GP)
        const ambientLight = new THREE.AmbientLight(0xdbeafe, 1.15);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xfff5e6, 0x0f172a, 0.85);
        scene.add(hemiLight);

        // Floodlight Sirkuit Utama (Pencahayaan Terang Khas Lampu Sirkuit Marina Bay)
        const trackLight1 = new THREE.DirectionalLight(0xffffff, 1.6);
        trackLight1.position.set(200, 350, 200);
        trackLight1.castShadow = true;
        trackLight1.shadow.mapSize.width = 2048;
        trackLight1.shadow.mapSize.height = 2048;
        trackLight1.shadow.camera.near = 10;
        trackLight1.shadow.camera.far = 1200;
        const d = 300;
        trackLight1.shadow.camera.left = -d;
        trackLight1.shadow.camera.right = d;
        trackLight1.shadow.camera.top = d;
        trackLight1.shadow.camera.bottom = -d;
        scene.add(trackLight1);

        const trackLight2 = new THREE.DirectionalLight(0x38bdf8, 0.9);
        trackLight2.position.set(-250, 280, -250);
        scene.add(trackLight2);

        // Kamera & Controls
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 3500);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;
        camera.position.set(420, 80, 130);
        controls.target.set(420, 48.6, 60);

        // ========================================================
        // 1. JALUR SIRKUIT BALAP F1 MARINA BAY STREET CIRCUIT
        // ========================================================
        // Koordinat lintasan presisi menyusuri jalanan kota Marina Bay Singapore
        const trackPoints = [
            new THREE.Vector3(420, 48.6, 60),    // Start / Finish Line (Pit Straight)
            new THREE.Vector3(430, 48.6, 180),   // Pit Straight exit towards Turn 1
            new THREE.Vector3(410, 48.6, 270),   // Turn 1 Entry
            new THREE.Vector3(330, 48.6, 320),   // Turn 2 Apex
            new THREE.Vector3(240, 48.6, 310),   // Turn 3 Exit
            new THREE.Vector3(160, 48.6, 380),   // Republic Boulevard
            new THREE.Vector3(40, 48.6, 490),    // Turn 5 Apex
            new THREE.Vector3(-120, 48.6, 480),  // Raffles Boulevard High Speed Straight
            new THREE.Vector3(-280, 48.6, 410),  // Raffles Boulevard DRS Zone
            new THREE.Vector3(-420, 48.6, 340),  // Turn 7 (Memorial Corner)
            new THREE.Vector3(-460, 48.6, 260),  // Turn 8 (Stamford Road)
            new THREE.Vector3(-400, 48.6, 180),  // Turn 9
            new THREE.Vector3(-320, 48.6, 80),   // St Andrew's Road (Padang)
            new THREE.Vector3(-240, 48.6, -20),  // Turn 11 (Anderson Bridge Entry)
            new THREE.Vector3(-160, 48.6, -70),  // Anderson Bridge crossing
            new THREE.Vector3(-110, 48.6, -75),  // Turn 13 (Fullerton Hairpin)
            new THREE.Vector3(-70, 48.6, 40),    // Esplanade Drive Bridge
            new THREE.Vector3(-30, 48.6, 150),   // Turn 14 Entry (The Float)
            new THREE.Vector3(60, 48.6, 130),    // Raffles Avenue Waterfront
            new THREE.Vector3(180, 48.6, 105),   // Marina Bay Waterfront Straight
            new THREE.Vector3(280, 48.6, 80),    // Floating Stadium Chicane
            new THREE.Vector3(345, 48.6, 30),    // Turn 20-21 Grandstand Exit
            new THREE.Vector3(390, 48.6, -10)    // Turn 22-23 (Final Sweeper back to Grid)
        ];
        const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'catmullrom', 0.2);

        // ========================================================
        // 2. LOAD MODEL 3D MARINA BAY STREET CIRCUIT & MOBIL F1
        // ========================================================
        let circuitModel = null;
        let carModel = null;
        let circuitLoaded = false;
        let carLoaded = false;

        const loader = new THREE.GLTFLoader();

        // Dukungan Draco Mesh Compression untuk GLB
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        function checkLoadComplete() {
            if (circuitLoaded && carLoaded) {
                const loaderEl = document.getElementById('circuit-loader');
                loaderEl.classList.add('fade-out');
                setTimeout(() => loaderEl.style.display = 'none', 500);

                if (soundEnabled) {
                    playBgmTheme();
                    playCarEngineAudio();
                }
            }
        }

        // 1. Memuat Model 3D Sirkuit Marina Bay Street Circuit (Kompresi Draco Ringan ~11.7MB)
        loader.load('./marina_bay_street_circuit.glb', (gltf) => {
            circuitModel = gltf.scene;
            circuitModel.traverse((child) => {
                if (child.isMesh) {
                    child.receiveShadow = true;
                }
            });
            scene.add(circuitModel);
            circuitLoaded = true;
            document.getElementById('loader-status').innerText = `Memuat Mobil: ${carData.name}...`;
            checkLoadComplete();
        }, (xhr) => {
            if (xhr.lengthComputable && !circuitLoaded) {
                const p = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('loader-status').innerText = `Memuat Sirkuit Marina Bay... ${p}%`;
            }
        }, (err) => {
            console.warn('Gagal memuat sirkuit Marina Bay:', err);
            circuitLoaded = true;
            checkLoadComplete();
        });

        // Fallback mobil balap prosedural
        function createFallbackCar(colorHex) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.8, roughness: 0.2 });
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 4.5), bodyMat);
            body.position.y = 0.35;
            body.castShadow = true;
            group.add(body);
            
            const nose = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.8, 4), bodyMat);
            nose.rotation.x = Math.PI / 2;
            nose.position.set(0, 0.25, 2.5);
            nose.castShadow = true;
            group.add(nose);

            const fWing = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.08, 0.6), blackMat);
            fWing.position.set(0, 0.15, 3.1);
            fWing.castShadow = true;
            group.add(fWing);

            const rWing = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 0.7), blackMat);
            rWing.position.set(0, 0.95, -2.1);
            rWing.castShadow = true;
            group.add(rWing);

            const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.45, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            [
                [-1.1, 0.42, 1.6],
                [1.1, 0.42, 1.6],
                [-1.15, 0.45, -1.5],
                [1.15, 0.45, -1.5]
            ].forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, blackMat);
                w.position.set(pos[0], pos[1], pos[2]);
                w.castShadow = true;
                group.add(w);
            });

            return group;
        }

        // 2. Memuat Model 3D Mobil Formula 1
        loader.load(carData.src, (gltf) => {
            carModel = gltf.scene;

            // Auto-scale & Adjust Pivot
            const bbox = new THREE.Box3().setFromObject(carModel);
            const size = bbox.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const targetLength = 5.2; // Panjang mobil F1 ~5.2 meter
            const s = (targetLength / maxDim) * carData.scale;
            carModel.scale.set(s, s, s);

            carModel.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(carModel);
            carLoaded = true;
            checkLoadComplete();
        }, (xhr) => {
            if (xhr.lengthComputable && circuitLoaded && !carLoaded) {
                const p = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('loader-status').innerText = `Memuat Mobil: ${carData.name}... ${p}%`;
            }
        }, (err) => {
            console.warn('Gagal memuat mobil utama, menggunakan mobil cadangan:', err);
            carModel = createFallbackCar(carData.color || 0xe10600);
            scene.add(carModel);
            carLoaded = true;
            checkLoadComplete();
        });

        // ========================================================
        // 3. TELEMETRY, PHYSICS & DRIVE LOOP
        // ========================================================
        let trackProgress = 0.0;
        let baseSpeed = 0.00035;
        let currentSpeedKmh = 0;
        let drsActive = false;
        let currentLap = 1;
        let lapStartTime = performance.now();

        // Camera Modes: 'chase', 'drone', 'cockpit', 'orbit'
        const CAM_MODES = ['chase', 'drone', 'cockpit', 'orbit'];
        let camIndex = 0;
        let currentCamMode = 'chase';

        function cycleCamera() {
            camIndex = (camIndex + 1) % CAM_MODES.length;
            currentCamMode = CAM_MODES[camIndex];
            const labels = {
                'chase': 'Chase Cam',
                'drone': 'Drone Cam',
                'cockpit': 'Cockpit Cam',
                'orbit': 'Free Orbit'
            };
            document.getElementById('cam-label').innerText = labels[currentCamMode];

            if (currentCamMode === 'orbit') {
                controls.enabled = true;
            } else {
                controls.enabled = false;
            }
        }

        function toggleDRS() {
            drsActive = !drsActive;
            const btn = document.getElementById('drs-toggle');
            if (drsActive) {
                btn.style.background = 'linear-gradient(135deg, #e11d48, #f43f5e)';
                btn.innerText = '🔥 DRS AKTIF!';
            } else {
                btn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
                btn.innerText = '⚡ DRS BOOST';
            }
        }

        // Dynamic Engine Audio Pitch Synthesizer
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;
        let soundEnabled = true;

        function initEngineAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();

                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();

                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(140, audioCtx.currentTime);

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                filter.Q.setValueAtTime(2.5, audioCtx.currentTime);

                engineGain.gain.setValueAtTime(soundEnabled ? 0.22 : 0, audioCtx.currentTime);

                engineOsc.connect(filter);
                filter.connect(engineGain);
                engineGain.connect(audioCtx.destination);

                engineOsc.start();
            } catch (e) {}
        }

        function playBgmTheme() {
            const bgm = document.getElementById('bgm-theme');
            if (bgm && soundEnabled) {
                bgm.volume = 0.45;
                bgm.play().catch(() => {});
            }
        }

        // Putar Suara Mesin Asli Khusus Mobil yang Dipilih
        function playCarEngineAudio() {
            const engAudio = document.getElementById('car-engine-audio');
            if (engAudio && soundEnabled && carData.sound) {
                if (!engAudio.src.endsWith(carData.sound.replace(/^\.\//, ''))) {
                    engAudio.src = carData.sound;
                }
                engAudio.volume = 0.55;
                engAudio.play().catch(() => {});
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
            const bgm = document.getElementById('bgm-theme');
            const engAudio = document.getElementById('car-engine-audio');
            if (bgm) {
                if (soundEnabled) bgm.play().catch(() => {});
                else bgm.pause();
            }
            if (engAudio) {
                if (soundEnabled) playCarEngineAudio();
                else engAudio.pause();
            }
            if (engineGain && audioCtx) {
                engineGain.gain.setValueAtTime(soundEnabled ? 0.22 : 0, audioCtx.currentTime);
            }
        }

        window.addEventListener('click', () => {
            if (!audioCtx) initEngineAudio();
            playBgmTheme();
            playCarEngineAudio();
        }, { once: true });

        // Animasi Loop Balapan
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (carModel) {
                // Kecepatan adaptif (Kencang di trek lurus Raffles Boulevard & Waterfront, melambat di tikungan)
                let speedFactor = 1.0;
                // Tikungan chicane Sheares (0.08 - 0.22) & Anderson Bridge / Fullerton hairpin (0.56 - 0.72)
                if ((trackProgress > 0.08 && trackProgress < 0.22) || (trackProgress > 0.56 && trackProgress < 0.72)) {
                    speedFactor = 0.62; // Pengereman tikungan
                } else if ((trackProgress > 0.26 && trackProgress < 0.44) || (trackProgress > 0.76 && trackProgress < 0.94)) {
                    speedFactor = 1.35; // Akselerasi trek lurus Raffles Blvd & Waterfront
                } else {
                    speedFactor = 1.0;
                }

                if (drsActive) speedFactor *= 1.45; // Boost DRS

                trackProgress = (trackProgress + baseSpeed * speedFactor) % 1.0;

                // Cek putaran Lap
                if (trackProgress < 0.002 && performance.now() - lapStartTime > 5000) {
                    currentLap++;
                    document.getElementById('lap-counter').innerText = currentLap;
                    lapStartTime = performance.now();
                }

                // Hitung Lap Time
                const elapsedLapMs = performance.now() - lapStartTime;
                const lapSec = Math.floor(elapsedLapMs / 1000);
                const lapMs = Math.floor((elapsedLapMs % 1000) / 10);
                document.getElementById('lap-time').innerText = 
                    `${String(lapSec).padStart(2, '0')}:${String(lapMs).padStart(2, '0')}`;

                // Posisi & Rotasi Mobil di Sepanjang Jalur Sirkuit
                const currentPos = trackCurve.getPointAt(trackProgress);
                const tangent = trackCurve.getTangentAt(trackProgress).normalize();

                carModel.position.copy(currentPos);
                carModel.position.y += carData.yOffset;

                // Arahkan mobil menghadap ke depan sesuai tangent sirkuit
                const lookAtTarget = currentPos.clone().add(tangent);
                carModel.lookAt(lookAtTarget);

                // Update Telemetry Speedometer
                const targetKmh = Math.round(180 * speedFactor + (Math.sin(performance.now() * 0.005) * 6));
                currentSpeedKmh += (targetKmh - currentSpeedKmh) * 0.12;
                document.getElementById('speedo-number').innerText = Math.round(currentSpeedKmh);

                // Gear indicator (1 - 8)
                const gear = Math.min(8, Math.max(1, Math.floor(currentSpeedKmh / 42) + 1));
                document.getElementById('gear-indicator').innerText = gear;

                // Update RPM LEDs
                const rpmRatio = (currentSpeedKmh % 45) / 45;
                const dots = document.querySelectorAll('.rpm-dot');
                dots.forEach((dot, idx) => {
                    if (idx / dots.length <= rpmRatio) dot.classList.add('active');
                    else dot.classList.remove('active');
                });

                // Update Audio Pitch Suara Mesin
                if (engineOsc && audioCtx && soundEnabled) {
                    const targetFreq = 160 + (currentSpeedKmh * 3.8);
                    engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.08);
                }
                const engAudio = document.getElementById('car-engine-audio');
                if (engAudio && soundEnabled && !engAudio.paused) {
                    // Modulasi pitch suara mesin asli sesuai kecepatan mobil (0.85x s/d 1.35x)
                    const targetRate = Math.min(1.35, Math.max(0.85, 0.85 + (currentSpeedKmh / 350) * 0.45));
                    engAudio.playbackRate = targetRate;
                }

                // ========================================================
                // 4. SISTEM KAMERA INTERAKTIF (CHASE / DRONE / COCKPIT)
                // ========================================================
                if (currentCamMode === 'chase') {
                    // Kamera mengejar di belakang mobil
                    const cameraOffset = tangent.clone().multiplyScalar(-14).add(new THREE.Vector3(0, 4.8, 0));
                    camera.position.copy(currentPos).add(cameraOffset);
                    camera.lookAt(currentPos.clone().add(new THREE.Vector3(0, 1.4, 0)));
                } else if (currentCamMode === 'drone') {
                    // Kamera helikopter dari atas menyusuri gedung kota Singapura
                    const cameraOffset = tangent.clone().multiplyScalar(-26).add(new THREE.Vector3(0, 32, 0));
                    camera.position.copy(currentPos).add(cameraOffset);
                    camera.lookAt(currentPos);
                } else if (currentCamMode === 'cockpit') {
                    // Kamera tepat di atas kokpit helm pembalap
                    const cameraOffset = tangent.clone().multiplyScalar(0.4).add(new THREE.Vector3(0, 1.25, 0));
                    camera.position.copy(currentPos).add(cameraOffset);
                    camera.lookAt(currentPos.clone().add(tangent.clone().multiplyScalar(20)));
                } else if (currentCamMode === 'orbit') {
                    controls.target.copy(currentPos);
                    controls.update();
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
