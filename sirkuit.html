<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D F1 Grand Prix - Simulator Sirkuit F1</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Three.js & Loaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --f1-red: #e10600;
            --f1-cyan: #38bdf8;
            --f1-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090d16;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #fff;
        }

        #webgl-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* ========================================================
           HUD & OVERLAYS
        ======================================================== */
        .hud-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .hud-top-bar > * {
            pointer-events: auto;
        }

        
        .nav-back-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 9px 16px;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.2s;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .nav-back-btn:active {
            transform: scale(0.95);
            background: #e11d48;
        }

        .car-badge {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #0284c7;
            padding: 8px 18px;
            border-radius: 25px;
            backdrop-filter: blur(12px);
            text-align: right;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .badge-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: #f8fafc;
        }

        .badge-cat {
            font-size: 0.7rem;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Telemetry Dashboard (Speedometer & Lap Time) */
        .hud-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 16px 20px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: linear-gradient(0deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .hud-bottom-bar > * {
            pointer-events: auto;
        }

        /* Speedometer Card */
        .speedo-card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 12px 18px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            min-width: 150px;
        }

        .rpm-leds {
            display: flex;
            gap: 3px;
            width: 100%;
        }

        .rpm-dot {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: #334155;
            transition: background 0.08s;
        }

        .rpm-dot.green.active { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .rpm-dot.red.active { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
        .rpm-dot.blue.active { background: #3b82f6; box-shadow: 0 0 8px #60a5fa; }

        .speedo-content {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .speedo-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.1rem;
            font-weight: 900;
            color: #f8fafc;
            line-height: 1;
        }

        .speedo-unit {
            font-size: 0.72rem;
            font-weight: 700;
            color: #94a3b8;
            margin-left: 4px;
        }

        .gear-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: #eab308;
            background: rgba(234, 179, 8, 0.15);
            padding: 2px 10px;
            border-radius: 8px;
            border: 1px solid rgba(234, 179, 8, 0.4);
        }

        /* Action Controls Buttons (Bottom Right) */
        .controls-card {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .hud-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.15s;
        }

        .hud-btn:active {
            transform: scale(0.92);
        }

        .hud-btn.drs-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
            animation: pulseDRS 1.5s infinite alternate;
        }

        @keyframes pulseDRS {
            from { box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
            to { box-shadow: 0 0 20px rgba(16, 185, 129, 0.8); }
        }

        /* Lap Timer Badge */
        .lap-badge {
            position: fixed;
            top: 75px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #cbd5e1;
            z-index: 15;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }

        /* Loading Screen */
        #circuit-loader {
            position: fixed;
            inset: 0;
            background: #090d16;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        #circuit-loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spin {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========================================================
           INTERACTIVE DRIVING CONTROLS (STEERING & PEDALS)
        ======================================================== */
        .driving-pad {
            position: fixed;
            bottom: 100px;
            z-index: 30;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .driving-pad.left-pad {
            left: 20px;
        }

        .driving-pad.right-pad {
            right: 20px;
        }

        .drive-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(56, 189, 248, 0.35);
            color: #f8fafc;
            width: 66px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.1s ease;
        }

        .drive-btn .btn-icon {
            font-size: 1.25rem;
            line-height: 1;
        }

        .drive-btn:active, .drive-btn.active {
            transform: scale(0.92);
        }

        /* Steering Buttons (Cyan accent) */
        .drive-btn.steer-btn:active, .drive-btn.steer-btn.active {
            background: rgba(2, 132, 199, 0.85);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
        }

        /* Gas Pedal (Green accent) */
        .drive-btn.gas-btn {
            border-color: rgba(34, 197, 94, 0.5);
        }
        .drive-btn.gas-btn:active, .drive-btn.gas-btn.active {
            background: rgba(22, 163, 74, 0.9);
            border-color: #22c55e;
            box-shadow: 0 0 22px rgba(34, 197, 94, 0.8);
        }

        /* Brake Pedal (Red accent) */
        .drive-btn.brake-btn {
            border-color: rgba(239, 68, 68, 0.5);
        }
        .drive-btn.brake-btn:active, .drive-btn.brake-btn.active {
            background: rgba(220, 38, 38, 0.9);
            border-color: #ef4444;
            box-shadow: 0 0 22px rgba(239, 68, 68, 0.8);
        }

        /* Driving Hint for Desktop Keyboard */
        .drive-hint {
            position: fixed;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 0.72rem;
            font-weight: 600;
            color: #94a3b8;
            backdrop-filter: blur(8px);
            z-index: 25;
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 640px) {
            .driving-pad {
                bottom: 84px;
                gap: 8px;
            }
            .drive-btn {
                width: 58px;
                height: 54px;
                font-size: 0.6rem;
            }
            .driving-pad.left-pad { left: 12px; }
            .driving-pad.right-pad { right: 12px; }
            .drive-hint { display: none; }
            .hud-bottom-bar {
                padding: 10px 12px 14px 12px;
            }
            .speedo-card {
                padding: 8px 12px;
                min-width: 120px;
            }
            .speedo-val {
                font-size: 1.6rem;
            }
            .gear-badge {
                font-size: 1.1rem;
                padding: 1px 8px;
            }
            .hud-btn {
                padding: 8px 12px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <!-- 3D WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Loading Screen -->
    <div id="circuit-loader">
        <div class="loader-spin"></div>
        <div style="font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; color: #f8fafc;">
            MEMASUKI CIRCUIT DE BARCELONA-CATALUNYA...
        </div>
        <div id="loader-status" style="font-size: 0.85rem; color: #94a3b8;">
            Mengunduh Sirkuit 3D Catalunya & Model Mobil...
        </div>
    </div>

    <!-- Lap Timer & Sector HUD -->
    <div class="lap-badge">
        ⏱️ LAP <span id="lap-counter" style="color: #38bdf8;">1</span> • <span id="lap-time" style="color: #22c55e;">00:00.00</span> • <span id="sector-indicator" style="color: #c084fc; font-weight: 800;">S1 (Turns 1-4)</span>
    </div>

    <!-- Top Navigation HUD -->
    <div class="hud-top-bar">
        <div style="display: flex; gap: 8px; align-items: center;">
            <a href="./index.html" class="nav-back-btn" id="btn-back">
                📷 Kembali ke AR
            </a>
            <!-- Catalunya Circuit Badge -->
            <div style="display: flex; align-items: center; gap: 7px; background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(56, 189, 248, 0.45); padding: 7px 14px; border-radius: 20px; color: #fff; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);">
                <span style="font-size: 1.1rem;">🇪🇸</span>
                <span style="font-family: 'Orbitron', sans-serif; font-size: 0.82rem; font-weight: 800; letter-spacing: 0.5px;">Barcelona-Catalunya</span>
                <span style="background: rgba(56, 189, 248, 0.2); color: #38bdf8; padding: 2px 7px; border-radius: 6px; font-size: 0.65rem; font-weight: 700;">14 TURNS</span>
            </div>
        </div>
        <div class="car-badge" id="hud-car-badge">
            <div class="badge-title" id="hud-car-name">Red Bull RB19</div>
            <div class="badge-cat" id="hud-car-cat">Spanish F1 GP • 4.675 KM</div>
        </div>
    </div>

    <!-- Interactive Driving Controls: Kemudi Belok Kiri & Kanan (Left Pad) -->
    <div class="driving-pad left-pad" id="steering-controls">
        <button class="drive-btn steer-btn" id="btn-steer-left" title="Belok Kiri (A / Panah Kiri)">
            <span class="btn-icon">◀</span>
            <span>KIRI</span>
        </button>
        <button class="drive-btn steer-btn" id="btn-steer-right" title="Belok Kanan (D / Panah Kanan)">
            <span class="btn-icon">▶</span>
            <span>KANAN</span>
        </button>
    </div>

    <!-- Interactive Driving Controls: Pedal Gas & Rem (Right Pad) -->
    <div class="driving-pad right-pad" id="pedal-controls">
        <button class="drive-btn brake-btn" id="btn-brake" title="Rem (S / Panah Bawah)">
            <span class="btn-icon">🛑</span>
            <span>REM</span>
        </button>
        <button class="drive-btn gas-btn" id="btn-gas" title="Gas (W / Panah Atas)">
            <span class="btn-icon">⚡</span>
            <span>GAS</span>
        </button>
    </div>

    <!-- Keyboard Driving Hint (Desktop) -->
    <div class="drive-hint">
        🎮 <b>Kemudi:</b> W/A/S/D atau Panah Keyboard • Spasi: DRS
    </div>

    <!-- Bottom Telemetry HUD -->
    <div class="hud-bottom-bar">
        <!-- Speedometer & Tachometer -->
        <div class="speedo-card">
            <div class="rpm-leds" id="rpm-bar">
                <div class="rpm-dot green"></div>
                <div class="rpm-dot green"></div>
                <div class="rpm-dot green"></div>
                <div class="rpm-dot red"></div>
                <div class="rpm-dot red"></div>
                <div class="rpm-dot red"></div>
                <div class="rpm-dot blue"></div>
                <div class="rpm-dot blue"></div>
            </div>
            <div class="speedo-content">
                <div>
                    <span class="speedo-val" id="speedo-number">0</span>
                    <span class="speedo-unit">KM/H</span>
                </div>
                <div class="gear-badge" id="gear-indicator">1</div>
            </div>
        </div>

        <!-- Camera & DRS Controls -->
        <div class="controls-card">
            <button class="hud-btn drs-btn" id="drs-toggle" onclick="toggleDRS()">
                ⚡ DRS BOOST
            </button>
            <button class="hud-btn" id="racing-line-btn" onclick="toggleRacingLine()" style="background: rgba(34, 197, 94, 0.3); border: 1px solid rgba(34, 197, 94, 0.6);" title="Toggle 3D F1 Racing Line">
                🏁 Line
            </button>
            <button class="hud-btn" onclick="cycleCamera()">
                🎥 <span id="cam-label">Chase Cam</span>
            </button>
            <button class="hud-btn" id="sound-btn" onclick="toggleSound()">
                🔊
            </button>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="bgm-theme" src="./f1_theme.m4a" loop preload="auto"></audio>
    <audio id="car-engine-audio" loop preload="auto"></audio>

        let racingLineMesh = null;

        function createF1RacingLineMesh() {
            const numSamples = 800;
            const ribbonWidth = 0.75; // Ramping, dinamis, gaya F1 Broadcast / Sim
            const vertices = [];
            const colors = [];
            const indices = [];

            for (let i = 0; i <= numSamples; i++) {
                const t = i / numSamples;
                const pt = trackCurve.getPointAt(t);
                const tangent = trackCurve.getTangentAt(t).normalize();
                const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

                const halfW = ribbonWidth / 2;
                const pLeft = pt.clone().add(normal.clone().multiplyScalar(halfW));
                const pRight = pt.clone().add(normal.clone().multiplyScalar(-halfW));
                pLeft.y += 0.04;
                pRight.y += 0.04;

                vertices.push(pLeft.x, pLeft.y, pLeft.z);
                vertices.push(pRight.x, pRight.y, pRight.z);

                const col = circuitData.getLineColor(t);
                colors.push(col.r, col.g, col.b);
                colors.push(col.r, col.g, col.b);

                if (i < numSamples) {
                    const base = i * 2;
                    indices.push(base, base + 1, base + 2);
                    indices.push(base + 1, base + 3, base + 2);
                }
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geom.setIndex(indices);

            const mat = new THREE.MeshBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: 0.65,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            racingLineMesh = new THREE.Mesh(geom, mat);
            scene.add(racingLineMesh);
        }

        function setupDrivingControls() {
            function bindControl(btnId, setFlag) {
                const el = document.getElementById(btnId);
                if (!el) return;

                const start = (e) => {
                    e.preventDefault();
                    setFlag(true);
                    el.classList.add('active');
                    if (navigator.vibrate) navigator.vibrate(12);
                    if (!audioCtx) initEngineAudio();
                    playBgmTheme();

                };

                const stop = (e) => {
                    if (e) e.preventDefault();
                    setFlag(false);
                    el.classList.remove('active');
                };

                el.addEventListener('touchstart', start, { passive: false });
                el.addEventListener('touchend', stop, { passive: false });
                el.addEventListener('touchcancel', stop, { passive: false });

                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', stop);
                el.addEventListener('mouseleave', stop);
            }

            bindControl('btn-steer-left', (v) => isSteerLeft = v);
            bindControl('btn-steer-right', (v) => isSteerRight = v);
            bindControl('btn-brake', (v) => isBrake = v);

                    isSteerLeft = true;
                    document.getElementById('btn-steer-left')?.classList.add('active');
                }
                if (e.code === 'KeyD' || e.code === 'ArrowRight') {
                    isSteerRight = true;

                }
                if (e.code === 'KeyW' || e.code === 'ArrowUp') {
                    isGas = true;
                    document.getElementById('btn-gas')?.classList.add('active');
                }
                if (e.code === 'KeyS' || e.code === 'ArrowDown') {
                    isBrake = true;
                    document.getElementById('btn-brake')?.classList.add('active');

                }
                if (e.code === 'KeyW' || e.code === 'ArrowUp') {
                    isGas = false;
                    document.getElementById('btn-gas')?.classList.remove('active');
                }
                if (e.code === 'KeyS' || e.code === 'ArrowDown') {
                    isBrake = false;
                    document.getElementById('btn-brake')?.classList.remove('active');
                }
            });
        }
        setupDrivingControls();

        // Camera Modes: 'chase', 'tv', 'drone', 'cockpit', 'orbit'
        const CAM_MODES = ['chase', 'tv', 'drone', 'cockpit', 'orbit'];
        let camIndex = 0;
        let currentCamMode = 'chase';

        // 7 Menara Kamera Siaran TV F1 Catalunya (Trackside Broadcast Towers)
        const TV_CAMERA_TOWERS = [
            { name: 'Tower 1 - Main Straight', pos: new THREE.Vector3(180, 24, 218) },
            { name: 'Tower 2 - Turn 1-2 Elf', pos: new THREE.Vector3(-280, 28, 145) },
            { name: 'Tower 3 - Turn 4 Repsol', pos: new THREE.Vector3(-660, 32, -140) },
            { name: 'Tower 4 - Turn 5 Seat Hairpin', pos: new THREE.Vector3(-275, 34, -235) },
            { name: 'Tower 5 - Turn 9 Campsa & Back Straight', pos: new THREE.Vector3(260, 35, -100) },
            { name: 'Tower 6 - Turn 10 La Caixa Hairpin', pos: new THREE.Vector3(535, 28, 55) },
            { name: 'Tower 7 - Turn 14 Final Sweeper', pos: new THREE.Vector3(625, 24, 130) }
        ];
        let currentTvTowerIndex = 0;

        function cycleCamera() {
            camIndex = (camIndex + 1) % CAM_MODES.length;
            currentCamMode = CAM_MODES[camIndex];
            const labels = {
                'chase': 'Chase Cam',
                'tv': '📺 TV Broadcast',
                'drone': 'Drone Cam',
                'cockpit': 'Cockpit Cam',
                'orbit': 'Free Orbit'
            };
            document.getElementById('cam-label').innerText = labels[currentCamMode];

            if (currentCamMode === 'orbit') {
                controls.enabled = true;
            } else {
                controls.enabled = false;
                camera.fov = 55;
                camera.updateProjectionMatrix();
            }
        }

        function toggleDRS() {
            drsActive = !drsActive;
            const btn = document.getElementById('drs-toggle');
            if (drsActive) {
                btn.style.background = 'linear-gradient(135deg, #e11d48, #f43f5e)';
                btn.innerText = '🔥 DRS AKTIF!';
            } else {
                btn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
                btn.innerText = '⚡ DRS BOOST';
            }
        }

        // Dynamic Engine Audio Pitch Synthesizer
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;
        let soundEnabled = true;

        function initEngineAudio() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();

                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();

                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(140, audioCtx.currentTime);

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                filter.Q.setValueAtTime(2.5, audioCtx.currentTime);

                engineGain.gain.setValueAtTime(soundEnabled ? 0.22 : 0, audioCtx.currentTime);

                engineOsc.connect(filter);
                filter.connect(engineGain);
                engineGain.connect(audioCtx.destination);

                engineOsc.start();
            } catch (e) {}
        }

        function playBgmTheme() {
            const bgm = document.getElementById('bgm-theme');
            if (bgm && soundEnabled) {
                bgm.volume = 0.45;
                bgm.play().catch(() => {});
            }
        }

        // Putar Suara Mesin Asli Khusus Mobil yang Dipilih
        function playCarEngineAudio() {
            const engAudio = document.getElementById('car-engine-audio');
            if (engAudio && soundEnabled && carData.sound) {
                if (!engAudio.src.endsWith(carData.sound.replace(/^\.\//, ''))) {
                    engAudio.src = carData.sound;
                }
                engAudio.volume = 0.55;
                engAudio.play().catch(() => {});
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
            const bgm = document.getElementById('bgm-theme');
            const engAudio = document.getElementById('car-engine-audio');
            if (bgm) {
                if (soundEnabled) bgm.play().catch(() => {});
                else bgm.pause();
            }
            if (engAudio) {
                if (soundEnabled) playCarEngineAudio();
                else engAudio.pause();
            }
            if (engineGain && audioCtx) {
                engineGain.gain.setValueAtTime(soundEnabled ? 0.22 : 0, audioCtx.currentTime);
            }
        }

        window.addEventListener('click', () => {
            if (!audioCtx) initEngineAudio();
            playBgmTheme();
            playCarEngineAudio();
        }, { once: true });

        // Animasi Loop Balapan
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (carModel) {
                // Kecepatan adaptif sirkuit Barcelona-Catalunya
                let speedFactor = circuitData.getSpeedFactor(trackProgress);

                // 1. Logika Kecepatan Berdasarkan Pedal Gas & Rem Pengguna
                if (isGas) {
                    targetUserSpeed = 1.65; // Akselerasi penuh saat tombol GAS ditekan (~320-350 km/h)
                } else if (isBrake) {
                    targetUserSpeed = 0.18; // Pengereman tajam saat tombol REM ditekan (~30-45 km/h)
                } else {
                    targetUserSpeed = 1.0;  // Kecepatan jelajah normal saat pedal dilepas (~200 km/h)
                }
                userSpeedMultiplier += (targetUserSpeed - userSpeedMultiplier) * 0.08;

                let totalSpeedFactor = speedFactor * userSpeedMultiplier;
                if (drsActive) totalSpeedFactor *= 1.45; // Boost DRS

                trackProgress = (trackProgress + baseSpeed * totalSpeedFactor * (delta * 60)) % 1.0;

                // 2. Logika Kemudi Belok Kanan & Kiri (Steering)
                const steerRate = 8.5 * delta; // Kecepatan perpindahan jalur melintang (meter/detik)
                if (isSteerLeft) {
                    lateralOffset = Math.max(-5.2, lateralOffset - steerRate);
                } else if (isSteerRight) {
                    lateralOffset = Math.min(5.2, lateralOffset + steerRate);
                } else {
                    // Auto-centering lembut kembali ke tengah racing line saat tombol dilepas
                    lateralOffset += (0 - lateralOffset) * 0.04;
                }

                currentLateralOffset += (lateralOffset - currentLateralOffset) * 0.22;

                const targetSteerAngle = isSteerRight ? 0.38 : (isSteerLeft ? -0.38 : 0.0);
                steeringVisualAngle += (targetSteerAngle - steeringVisualAngle) * 0.16;

                // Cek putaran Lap
                if (trackProgress < 0.002 && performance.now() - lapStartTime > 5000) {
                    currentLap++;
                    document.getElementById('lap-counter').innerText = currentLap;
                    lapStartTime = performance.now();
                }

                // Hitung Lap Time
                const elapsedLapMs = performance.now() - lapStartTime;
                const lapSec = Math.floor(elapsedLapMs / 1000);
                const lapMs = Math.floor((elapsedLapMs % 1000) / 10);
                document.getElementById('lap-time').innerText = 
                    `${String(lapSec).padStart(2, '0')}:${String(lapMs).padStart(2, '0')}`;

                // Sector Tracker F1 Circuit de Barcelona-Catalunya
                let sectorText = 'S1 (Turns 1-4)';
                let sectorColor = '#c084fc';
                if (trackProgress < 0.28) {
                    sectorText = 'S1 (Turns 1-4)';
                    sectorColor = '#c084fc';
                } else if (trackProgress < 0.65) {
                    sectorText = 'S2 (Turns 5-9)';
                    sectorColor = '#38bdf8';
                } else {
                    sectorText = 'S3 (Turns 10-14)';
                    sectorColor = '#4ade80';
                }
                const secEl = document.getElementById('sector-indicator');
                if (secEl) {
                    secEl.innerText = sectorText;
                    secEl.style.color = sectorColor;
                }

                // Deteksi Zona DRS Catalunya (Zona 1: Pit Straight, Zona 2: Back Straight)
                const inDRSZone = (trackProgress >= 0.88 || trackProgress <= 0.12 || (trackProgress >= 0.60 && trackProgress <= 0.70));
                const drsBtn = document.getElementById('drs-toggle');
                if (drsBtn) {
                    if (drsActive) {
                        drsBtn.style.background = 'linear-gradient(135deg, #e11d48, #f43f5e)';
                        drsBtn.innerText = '🔥 DRS ON (+45 KM/H)';
                        drsBtn.style.boxShadow = '0 0 16px rgba(244, 63, 94, 0.7)';
                    } else if (inDRSZone) {
                        drsBtn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
                        drsBtn.innerText = '⚡ DRS TERSEDIA';
                        drsBtn.style.boxShadow = '0 0 14px rgba(16, 185, 129, 0.6)';
                    } else {
                        drsBtn.style.background = 'rgba(255, 255, 255, 0.12)';
                        drsBtn.innerText = '⚡ DRS ZONA TUTUP';
                        drsBtn.style.boxShadow = 'none';
                    }
                }

                // 3. Posisi & Rotasi Mobil di Sepanjang Jalur Sirkuit dengan Offset Kemudi
                const currentPos = trackCurve.getPointAt(trackProgress);
                const lookAheadProgress = (trackProgress + 0.0012) % 1.0;
                const lookAheadPos = trackCurve.getPointAt(lookAheadProgress);
                const tangent = lookAheadPos.clone().sub(currentPos).normalize();

                // Vektor normal tegak lurus mengarah ke kanan mobil
                const upVec = new THREE.Vector3(0, 1, 0);
                const normalRight = tangent.clone().cross(upVec).normalize();

                // Posisi aktual mobil setelah dibelokkan ke kiri/kanan
                const actualCarPos = currentPos.clone().addScaledVector(normalRight, currentLateralOffset);
                carModel.position.copy(actualCarPos);
                carModel.position.y += carData.yOffset;

                // Arah hadap moncong mobil menyusuri jalur belokan
                const actualLookAheadPos = lookAheadPos.clone().addScaledVector(normalRight, currentLateralOffset);
                carModel.lookAt(actualLookAheadPos.x, actualCarPos.y, actualLookAheadPos.z);

                // Animasi visual moncong menoleh (yaw) & suspensi miring (body roll) saat belok
                if (Math.abs(steeringVisualAngle) > 0.005) {
                    carModel.rotateY(-steeringVisualAngle * 0.35);
                    carModel.rotateZ(-steeringVisualAngle * 0.10);
                }

                // Update Telemetry Speedometer aktual
                const targetKmh = Math.round(180 * totalSpeedFactor + (Math.sin(performance.now() * 0.005) * 6));
                currentSpeedKmh += (targetKmh - currentSpeedKmh) * 0.12;
                document.getElementById('speedo-number').innerText = Math.max(0, Math.round(currentSpeedKmh));

                // Gear indicator (1 - 8)
                const gear = Math.min(8, Math.max(1, Math.floor(currentSpeedKmh / 42) + 1));
                document.getElementById('gear-indicator').innerText = gear;

                // Update RPM LEDs
                const rpmRatio = (currentSpeedKmh % 45) / 45;
                const dots = document.querySelectorAll('.rpm-dot');
                dots.forEach((dot, idx) => {
                    if (idx / dots.length <= rpmRatio) dot.classList.add('active');
                    else dot.classList.remove('active');
                });

                // Update Audio Pitch Suara Mesin
                if (engineOsc && audioCtx && soundEnabled) {
                    const targetFreq = 160 + (currentSpeedKmh * 3.8);
                    engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.08);
                }
                const engAudio = document.getElementById('car-engine-audio');
                if (engAudio && soundEnabled && !engAudio.paused) {
                    // Modulasi pitch suara mesin asli sesuai kecepatan mobil (0.85x s/d 1.35x)
                    const targetRate = Math.min(1.35, Math.max(0.85, 0.85 + (currentSpeedKmh / 350) * 0.45));
                    engAudio.playbackRate = targetRate;
                }

                // ========================================================
                // 4. SISTEM KAMERA INTERAKTIF (CHASE / TV BROADCAST / DRONE / COCKPIT / ORBIT)
                // ========================================================
                if (currentCamMode === 'chase') {
                    // Kamera mengejar di belakang mobil mengikuti kemudi aktual
                    const cameraOffset = tangent.clone().multiplyScalar(-14).add(new THREE.Vector3(0, 4.8, 0));
                    camera.position.copy(actualCarPos).add(cameraOffset);
                    camera.lookAt(actualCarPos.clone().add(new THREE.Vector3(0, 1.4, 0)));
                } else if (currentCamMode === 'tv') {
                    // Kamera Siaran TV F1 (Pilih menara trackside terdekat dan tracking mulus)
                    let bestTowerIdx = 0;
                    let bestDistSq = Infinity;
                    for (let i = 0; i < TV_CAMERA_TOWERS.length; i++) {
                        const dSq = TV_CAMERA_TOWERS[i].pos.distanceToSquared(actualCarPos);
                        if (dSq < bestDistSq) {
                            bestDistSq = dSq;
                            bestTowerIdx = i;
                        }
                    }
                    currentTvTowerIndex = bestTowerIdx;
                    const towerPos = TV_CAMERA_TOWERS[currentTvTowerIndex].pos;
                    camera.position.lerp(towerPos, 0.12);
                    camera.lookAt(actualCarPos.clone().add(new THREE.Vector3(0, 0.8, 0)));

                    // Dynamic Telephoto Lens Zoom
                    const dist = Math.sqrt(bestDistSq);
                    const targetFov = THREE.MathUtils.clamp(26 + dist * 0.10, 28, 52);
                    camera.fov += (targetFov - camera.fov) * 0.08;
                    camera.updateProjectionMatrix();
                } else if (currentCamMode === 'drone') {
                    // Kamera helikopter dari atas menyusuri sirkuit
                    const cameraOffset = tangent.clone().multiplyScalar(-26).add(new THREE.Vector3(0, 32, 0));
                    camera.position.copy(actualCarPos).add(cameraOffset);
                    camera.lookAt(actualCarPos);
                } else if (currentCamMode === 'cockpit') {
                    // Kamera tepat di atas kokpit helm pembalap
                    const cameraOffset = tangent.clone().multiplyScalar(0.4).add(new THREE.Vector3(0, 1.25, 0));
                    camera.position.copy(actualCarPos).add(cameraOffset);
                    camera.lookAt(actualCarPos.clone().add(tangent.clone().multiplyScalar(20)));
                } else if (currentCamMode === 'orbit') {
                    controls.target.copy(actualCarPos);
                    controls.update();
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
