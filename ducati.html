<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Ducati Desmosedici MotoGP</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
        #badge {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 2px solid #f59e0b;
            padding: 8px 18px; border-radius: 20px; color: #fff;
            font-size: 13px; font-weight: bold; z-index: 1000;
            white-space: nowrap; pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="badge">🏍️ Ducati Desmosedici (Arahkan ke Kartu)</div>

    <!-- Scene AR khusus Ducati Desmosedici -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; missTolerance: 20; warmupTolerance: 2; filterMinCF: 0.0001; filterBeta: 0.001;" 
        color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-light type="ambient" intensity="1.6"></a-light>
        <a-light type="directional" position="2 4 3" intensity="2.0"></a-light>
        <a-light type="directional" position="-2 -2 2" intensity="1.0" color="#93c5fd"></a-light>

        <a-entity mindar-image-target="targetIndex: 2">
            <a-gltf-model src="./ducati_desmo.glb" position="0 0 0.05" rotation="90 0 0" scale="0.26 0.26 0.26"></a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        const badge = document.getElementById('badge');
        document.querySelectorAll('a-entity[mindar-image-target]').forEach(t => {
            t.addEventListener('targetFound', () => {
                badge.innerText = '🏁 Ducati MotoGP Terdeteksi!';
                badge.style.borderColor = '#22c55e';
            });
        });
    </script>

</body>

</html>
