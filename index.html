<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Red Bull RB19</title>

    <!-- Library A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 99999;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #e11d48;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 16px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- Indikator Loading Ringan saat Kamera Menyiapkan Feed -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Memulai Kamera AR...</div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <!-- Kamera AR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Marker QR & Model 3D F1 (Dimuat langsung tanpa memblokir kamera) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                src="./redbull_RB19.glb" 
                position="0 0 0.05" 
                rotation="90 0 0" 
                scale="0.22 0.22 0.22">
            </a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const loader = document.getElementById('loader');

        // Hilangkan layar loading begitu kamera aktif
        scene.addEventListener('arReady', () => {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 400);
        });

        // Tangani jika ada pesan error kamera
        scene.addEventListener('arError', () => {
            loader.querySelector('.loader-text').innerText = 'Gagal mengakses kamera. Pastikan izin kamera aktif & menggunakan HTTPS.';
            loader.querySelector('.spinner').style.display = 'none';
        });
    </script>

</body>

</html>
