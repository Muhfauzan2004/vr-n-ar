<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Racing Showcase (Red Bull, Ferrari F1-75, Ducati)</title>

    <!-- Library A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 99999;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #e11d48;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 16px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }

        #modelBadge {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 20px;
            color: #fff;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            font-weight: 600;
            z-index: 1000;
            letter-spacing: 0.5px;
            pointer-events: none;
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>

    <!-- Indikator Loading Ringan saat Kamera Menyiapkan Feed -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Memulai Kamera AR...</div>
    </div>

    <!-- Badge Info Model -->
    <div id="modelBadge">🔍 Arahkan kamera ke Kartu Target</div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.001; filterBeta: 1000;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <!-- Kamera AR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Pencahayaan Realistis -->
        <a-light type="ambient" intensity="1.5" color="#ffffff"></a-light>
        <a-light type="directional" position="2 4 3" intensity="2.0" color="#ffffff"></a-light>
        <a-light type="directional" position="-2 -2 2" intensity="1.0" color="#93c5fd"></a-light>

        <!-- TARGET 0: Red Bull RB19 (marker_redbull.png) -->
        <a-entity id="target-redbull" mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                id="model-redbull"
                src="./redbull_RB19.glb" 
                position="0 0 0.05" 
                rotation="90 0 0" 
                scale="0.22 0.22 0.22">
            </a-gltf-model>
        </a-entity>

        <!-- TARGET 1: Ferrari F1-75 (marker_ferrari.png) -->
        <a-entity id="target-ferrari" mindar-image-target="targetIndex: 1">
            <a-gltf-model 
                id="model-ferrari"
                src="./ferarri_f1-75.glb" 
                position="0 0 0.05" 
                rotation="90 0 0" 
                scale="0.15 0.15 0.15">
            </a-gltf-model>
        </a-entity>

        <!-- TARGET 2: Ducati Desmosedici (marker_ducati.png) -->
        <a-entity id="target-ducati" mindar-image-target="targetIndex: 2">
            <a-gltf-model 
                id="model-ducati"
                src="./ducati_desmo.glb" 
                position="0 0 0.05" 
                rotation="90 0 0" 
                scale="0.26 0.26 0.26">
            </a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const loader = document.getElementById('loader');
        const badge = document.getElementById('modelBadge');

        const targetRedbull = document.getElementById('target-redbull');
        const targetFerrari = document.getElementById('target-ferrari');
        const targetDucati = document.getElementById('target-ducati');
        const targets = [targetRedbull, targetFerrari, targetDucati];

        // Membaca parameter ?model=redbull / ?model=ferrari / ?model=ducati dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const selectedModel = (urlParams.get('model') || '').toLowerCase();

        const modelConfigs = {
            'redbull': { src: './redbull_RB19.glb', scale: '0.22 0.22 0.22', name: '🏎️ Red Bull RB19', color: '#0284c7' },
            'rb19':    { src: './redbull_RB19.glb', scale: '0.22 0.22 0.22', name: '🏎️ Red Bull RB19', color: '#0284c7' },
            'ferrari': { src: './ferarri_f1-75.glb', scale: '0.15 0.15 0.15', name: '🏎️ Ferrari F1-75', color: '#e11d48' },
            'f1-75':   { src: './ferarri_f1-75.glb', scale: '0.15 0.15 0.15', name: '🏎️ Ferrari F1-75', color: '#e11d48' },
            'ducati':  { src: './ducati_desmo.glb', scale: '0.26 0.26 0.26', name: '🏍️ Ducati Desmosedici', color: '#f59e0b' }
        };

        // 1. JIKA URL MENENTUKAN MODEL SPESIFIK (misal ?model=ferrari saat scan QR Ferrari):
        if (selectedModel && modelConfigs[selectedModel]) {
            const config = modelConfigs[selectedModel];
            badge.innerText = config.name + ' (Arahkan ke Kartu)';
            badge.style.borderColor = config.color;

            targets.forEach(t => {
                if (!t) return;
                const m = t.querySelector('a-gltf-model');
                if (m) {
                    m.setAttribute('src', config.src);
                    m.setAttribute('scale', config.scale);
                }
                t.addEventListener('targetFound', () => {
                    t.setAttribute('visible', 'true');
                    badge.innerText = config.name + ' Aktif!';
                });
                t.addEventListener('targetLost', () => {
                    t.setAttribute('visible', 'false');
                    badge.innerText = config.name + ' (Arahkan ke Kartu)';
                });
            });
        } else {
            // 2. JIKA TANPA PARAMETER (Mode Multi-Target / Semua Model):
            const allTargets = [
                { el: targetRedbull, name: '🏎️ Red Bull RB19', color: '#0284c7' },
                { el: targetFerrari, name: '🏎️ Ferrari F1-75', color: '#e11d48' },
                { el: targetDucati, name: '🏍️ Ducati Desmosedici', color: '#f59e0b' }
            ];

            allTargets.forEach((item, idx) => {
                if (!item.el) return;

                item.el.addEventListener('targetFound', () => {
                    allTargets.forEach((other, oIdx) => {
                        if (other.el && oIdx !== idx) {
                            other.el.setAttribute('visible', 'false');
                        }
                    });
                    item.el.setAttribute('visible', 'true');
                    badge.innerText = item.name + ' Aktif!';
                    badge.style.borderColor = item.color;
                });

                item.el.addEventListener('targetLost', () => {
                    item.el.setAttribute('visible', 'false');
                    badge.innerText = '🔍 Mencari Kartu Target...';
                    badge.style.borderColor = 'rgba(255, 255, 255, 0.15)';
                });
            });
        }

        // Hilangkan layar loading begitu kamera siap
        scene.addEventListener('arReady', () => {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 400);
        });

        // Tangani pesan jika kamera gagal diakses
        scene.addEventListener('arError', () => {
            loader.querySelector('.loader-text').innerText = 'Gagal mengakses kamera. Pastikan izin kamera aktif & menggunakan HTTPS.';
            loader.querySelector('.spinner').style.display = 'none';
        });
    </script>

</body>

</html>
