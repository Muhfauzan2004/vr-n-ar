<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Racing Showcase (Red Bull, Ferrari, Ducati)</title>

    <!-- Library A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 99999;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #e11d48;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 16px;
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- Indikator Loading Ringan saat Kamera Menyiapkan Feed -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Memulai Kamera AR (3 Model)...</div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <!-- Kamera AR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Pencahayaan Realistis -->
        <a-light type="ambient" intensity="1.5" color="#ffffff"></a-light>
        <a-light type="directional" position="2 4 3" intensity="2.0" color="#ffffff"></a-light>
        <a-light type="directional" position="-2 -2 2" intensity="1.0" color="#93c5fd"></a-light>

        <!-- TARGET 0: Red Bull RB19 (qr_redbull.png) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                src="./redbull_RB19.glb" 
                position="0 0 0.05" 
                rotation="90 0 0" 
                scale="0.22 0.22 0.22">
            </a-gltf-model>
        </a-entity>

        <!-- TARGET 1: Ferrari F1 (qr_ferrari.png) -->
        <a-entity mindar-image-target="targetIndex: 1">
            <a-gltf-model 
                src="./ferrari_f1.glb" 
                position="0 0 0.05" 
                rotation="90 0 0" 
                scale="0.15 0.15 0.15">
            </a-gltf-model>
        </a-entity>

        <!-- TARGET 2: Ducati Desmosedici (qr_ducati.png) -->
        <a-entity mindar-image-target="targetIndex: 2">
            <a-gltf-model 
                src="./ducati_desmo.glb" 
                position="0 0 0.05" 
                rotation="90 0 0" 
                scale="0.26 0.26 0.26">
            </a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const loader = document.getElementById('loader');

        // Hilangkan layar loading begitu kamera aktif
        scene.addEventListener('arReady', () => {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 400);
        });

        // Tangani jika ada pesan error kamera
        scene.addEventListener('arError', () => {
            loader.querySelector('.loader-text').innerText = 'Gagal mengakses kamera. Pastikan izin kamera aktif & menggunakan HTTPS.';
            loader.querySelector('.spinner').style.display = 'none';
        });
    </script>

</body>

</html>
